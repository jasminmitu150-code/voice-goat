[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicegoat"
version = "0.1.0"
description = "A purposely vulnerable voice agent for security training"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "VoiceGoat Contributors" }
]
keywords = ["security", "voice-agent", "llm", "owasp", "ctf", "vulnerable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "boto3>=1.34.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "openai>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
]
speech = [
    "amazon-transcribe>=0.6.2",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
]
rag = [
    "opensearch-py>=2.4.0",
    "sentence-transformers>=2.3.0",
    "langchain>=0.1.0",
    "langchain-aws>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redcaller/voice-goat"
Documentation = "https://github.com/redcaller/voice-goat/docs"
Repository = "https://github.com/redcaller/voice-goat"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=services --cov-report=term-missing"
